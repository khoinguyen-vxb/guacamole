# The README's checks. Tests use scripted fixture providers: no model calls or secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # graphiti's falkordblite needs glibc >= 2.39; sysml's x86-64 wheel carries its
    # standard library, so the SysML tests skipped on aarch64 run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/ty check
