[project]
name = "guacamole-engineering"
version = "0.1.0"
description = "Local typed tools and traceable engineering agent workflows"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "pydantic>=2.12,<3",
    "mcp>=2.2,<3",
    "tiktoken>=0.12,<1",
    "sysml>=0.1.0",
    # CAD integrations every project's agents get: drawings (ezdxf) and AP242 (OCCT).
    "ezdxf>=1.4,<2",
    "cadquery-ocp>=7.9.3,<7.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.optional-dependencies]
websocket = ["websockets>=15,<17"]
litellm = ["litellm>=1.104,<2"]
langchain = ["langchain>=1.4,<2", "langchain-litellm>=0.11,<1"]
graphiti = ["graphiti-core[falkordblite]>=0.30,<1"]
mem0 = ["mem0ai>=2.2,<3"]
sounding-rocket = [
    "websockets>=15,<17",
    "pypdf>=6,<7",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "pypdfium2>=5,<6",
]
usd = ["usd-core>=25.5,<27"]
# Reference library: Docling parses layout, pypdf is the text-only fallback, and
# pypdfium2 renders pages for OCR verification.
library = ["docling>=2,<3", "pypdf>=6,<7", "pypdfium2>=5,<6"]
# The RDE example: equilibrium and detonation thermochemistry.
rde = ["cantera>=3.2,<4", "scipy>=1.16,<2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16", "ty>=0.0.84"]

[tool.hatch.build.targets.wheel]
packages = ["src/guacamole"]

[tool.pytest.ini_options]
# Never collect the third-party test suites cloned under examples/*/tooling.
testpaths = ["tests"]
pythonpath = ["."]  # tests import examples.*

[tool.ruff]
target-version = "py313"
# Agent-written run outputs; reformatting one breaks its recorded hash.
extend-exclude = ["examples/*/results", "examples/*/runs"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/guacamole"]
# Runs inside FreeCAD's own interpreter, which provides FreeCAD, Part and the Workbench.
exclude = [
    "src/guacamole/integrations/mbd_freecad.py",
    "src/guacamole/integrations/drawing_freecad.py",
]

[tool.ty.analysis]
# OCP's and USD's partial stubs omit most of their compiled classes.
replace-imports-with-any = ["OCP.**", "pxr.**"]
